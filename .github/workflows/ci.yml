name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend quality and migrations
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      KANBAI_ENVIRONMENT: test
      KANBAI_DATABASE_URL: postgresql+psycopg://kanbai:kanbai@localhost:5432/kanbai_test
      KANBAI_TEST_DATABASE_URL: postgresql+psycopg://kanbai:kanbai@localhost:5432/kanbai_test
      UV_LOCKED: "true"
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: kanbai
          POSTGRES_PASSWORD: kanbai
          POSTGRES_DB: kanbai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kanbai -d kanbai_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Install uv and enable its cache
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.12.10
          enable-cache: true
          cache-dependency-glob: |
            backend/pyproject.toml
            backend/uv.lock
      - name: Install Python 3.14
        working-directory: backend
        run: uv python install
      - name: Show backend tool versions
        working-directory: backend
        run: uv --version && uv run python --version
      - name: Install locked backend dependencies
        working-directory: backend
        run: uv sync --locked --dev
      - name: Apply migrations to PostgreSQL
        working-directory: backend
        run: uv run alembic upgrade head
      - name: Detect ungenerated migrations
        working-directory: backend
        run: uv run alembic check
      - name: Run backend quality gate
        working-directory: backend
        run: uv run poe check
      - name: Regenerate the OpenAPI contract
        working-directory: backend
        run: uv run poe openapi
      - name: Verify the OpenAPI contract is committed
        run: git diff --exit-code -- backend/openapi.json

  frontend:
    name: Frontend quality and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Install Node and enable the npm cache
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Show frontend tool versions
        working-directory: frontend
        run: node --version && npm --version
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Recalculate the npm lockfile without installing packages
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify the npm lockfile is committed
        run: git diff --exit-code -- frontend/package-lock.json
      - name: Regenerate API types
        working-directory: frontend
        run: npm run gen:api
      - name: Verify generated API types are committed
        run: git diff --exit-code -- frontend/src/api/schema.d.ts
      - name: Run frontend quality gate
        working-directory: frontend
        run: npm run check
      - name: Build the frontend
        working-directory: frontend
        run: npm run build

  compose:
    name: Compose smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build and start the complete stack
        run: docker compose -p kanbai-ci up -d --build --wait --wait-timeout 180
      - name: Check backend and frontend health
        run: |
          curl --fail --show-error http://localhost:8000/health
          curl --fail --show-error http://localhost:8000/api/v1/health/ready
          curl --fail --show-error http://localhost:5173/
          curl --fail --show-error http://localhost:5173/api/v1/health/ready
      - name: Check both PostgreSQL databases exist
        run: |
          test "$(docker compose -p kanbai-ci exec -T db psql -U kanbai -d postgres -tAc "SELECT count(*) FROM pg_database WHERE datname IN ('kanbai', 'kanbai_test')")" = "2"
      - name: Collect Compose diagnostics on failure
        if: failure()
        run: |
          docker compose -p kanbai-ci ps -a
          docker compose -p kanbai-ci logs --no-color
      - name: Remove only CI containers and volumes
        if: always()
        run: docker compose -p kanbai-ci down --volumes --remove-orphans
